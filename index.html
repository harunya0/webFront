<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albot Console</title>

<!-- フォント: Inter & Fira Code -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- 外部ライブラリ (Highlight.js, KaTeX, Mermaid) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/artifacts.css">
<link rel="stylesheet" href="/css/markdown.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/files.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<div id="overlay" class="overlay" onclick="closeSidebar()"></div>

<!-- アプリメインレイアウト -->
<div id="appContainer">

  <!-- 1. サイドバー (Claudeスタイル) -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewSession()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>新規チャット</span>
      </button>
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
    </div>

    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <div class="section-title">会話セッション</div>
        <div class="new-session-row">
          <input type="text" id="newSession" placeholder="セッション名...">
          <button onclick="switchSession()">作成</button>
        </div>
        <ul class="session-list" id="sessionList"></ul>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Web 検索</div>
        <div class="search-box">
          <input type="text" id="searchQuery" placeholder="キーワードを入力...">
          <button onclick="runSearch()">検索</button>
        </div>
        <label class="toggle-row">
          <input type="checkbox" id="searchAi" onchange="onSearchAiToggle()">
          <span>AIによる要約回答</span>
        </label>
        <ul class="search-results" id="searchResults"></ul>
      </div>

      <div class="sidebar-section">
        <div class="section-title">同期チャンネル (Discord ID)</div>
        <div class="channel-row">
          <input type="text" id="channelInput" placeholder="0 (Web単独) または ID">
          <button onclick="switchChannel()">切替</button>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="settings-trigger-btn" onclick="openSettingsModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>API接続設定</span>
      </button>
    </div>
  </aside>

  <!-- 2. メインチャットエリア (Claudeスタイル) -->
  <main id="mainChatArea">
    <!-- ヘッダーバー -->
    <header class="chat-header">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      
      <div class="model-selector-wrapper">
        <select id="modelSelect" class="model-select-pill" onchange="switchModel()">
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
          <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
          <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-haiku-35-20250620">Claude Haiku 3.5</option>
          <option value="gpt-4o-mini">GPT-4o Mini</option>
          <option value="gpt-4o">GPT-4o</option>
        </select>
      </div>

      <div class="header-status">
        <span class="status-indicator online"></span>
        <span id="sbSessionM" class="session-badge">default</span>
      </div>
    </header>

    <!-- チャットログ -->
    <div id="log" class="chat-log"></div>

    <!-- フローティング入力ボックス -->
    <div class="input-container-wrapper">
      <div id="filePreview" class="file-preview-bar"></div>
      
      <div class="prompt-box">
        <textarea id="messageInput" placeholder="メッセージを入力... (Shift+Enterで改行)" rows="1"></textarea>
        
        <div class="prompt-actions">
          <div class="prompt-left-actions">
            <input type="file" id="fileInput" multiple style="display: none" onchange="handleFileSelect(event)">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="ファイルを添付">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
          </div>

          <button id="sendBtn" class="send-btn" onclick="sendMessage()" title="送信">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
      <div class="prompt-footer-hint">Claude-like Artifacts & Markdown モード有効</div>
    </div>
  </main>

  <!-- 3. Claudeスタイル Artifacts パネル -->
  <aside id="artifactsPanel" class="artifacts-panel">
    <div class="artifacts-header">
      <div class="artifacts-title-group">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span id="artifactsTitle">Artifact</span>
      </div>
      <div class="artifacts-header-actions">
        <div class="artifacts-tabs">
          <button id="tabCodeBtn" class="artifacts-tab active" onclick="switchArtifactTab('code')">Code</button>
          <button id="tabPreviewBtn" class="artifacts-tab" onclick="switchArtifactTab('preview')">Preview</button>
        </div>
        <button class="icon-action-btn" onclick="copyArtifactCode()" title="コードをコピー">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <button class="icon-action-btn" onclick="downloadArtifact()" title="ダウンロード">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button class="artifacts-close-btn" onclick="closeArtifactsPanel()">✕</button>
      </div>
    </div>

    <div class="artifacts-body">
      <!-- コードビュー -->
      <div id="artifactCodeView" class="artifact-view-content active">
        <pre><code id="artifactCodeBlock" class="hljs"></code></pre>
      </div>
      <!-- ライブプレビュービュー (HTML/SVG/Mermaid) -->
      <div id="artifactPreviewView" class="artifact-view-content">
        <iframe id="artifactSandboxFrame" sandbox="allow-scripts" title="Artifact Sandbox"></iframe>
        <div id="artifactMermaidContainer"></div>
      </div>
    </div>
  </aside>

</div>

<!-- 接続設定モーダル -->
<div id="settingsModal" class="modal-overlay" onclick="closeSettingsModalOnOutside(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h3>API 接続設定</h3>
      <button class="modal-close" onclick="closeSettingsModal()">✕</button>
    </div>
    <div class="modal-body">
      <label class="input-label">API ベース URL</label>
      <input type="text" id="apiBaseInput" placeholder="例: https://api.example.com">
      
      <label class="input-label">API アクセストークン</label>
      <input type="password" id="tokenInput" placeholder="WEB_API_TOKEN の値">
    </div>
    <div class="modal-footer">
      <button class="secondary-btn" onclick="closeSettingsModal()">キャンセル</button>
      <button class="primary-btn" onclick="saveConnectionModal()">保存して接続</button>
    </div>
  </div>
</div>

<!-- 外部ライブラリ (Markdown, Highlight, KaTeX, Mermaid, DOMPurify) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>

<!-- アプリ JS モジュール -->
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/state.js"></script>
<script src="/js/files.js"></script>
<script src="/js/markdown.js"></script>
<script src="/js/artifacts.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/status.js"></script>
<script src="/js/search.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
